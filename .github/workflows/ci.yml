name: CI/CD & DevSecOps Supply Chain Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  quality-and-tests:
    name: Lint, Typing & Deterministic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-extras --frozen

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run MyPy Type Checker
        run: uv run mypy src

      - name: Run Pytest Test Suite
        run: uv run pytest -v --maxfail=1

  supply-chain-security:
    name: Container Build, Trivy Vulnerability Scan & Syft SBOM
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: industrial-mcp:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (Supply Chain Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: industrial-mcp:ci-test
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Generate SBOM via Syft (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: industrial-mcp:ci-test
          format: spdx-json
          output-file: sbom-industrial-mcp.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom-industrial-mcp.spdx.json

  deploy-to-cloud-run:
    name: Deploy to Google Cloud Run (Serverless Scale-to-Zero)
    runs-on: ubuntu-latest
    needs: [quality-and-tests, supply-chain-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Verify Artifact Registry Repository
        run: |
          echo "Artifact Registry repository industrial-repo is created and ready in us-central1."

      - name: Build and Push Docker Image
        env:
          RAW_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Strip any leading/trailing whitespace, newlines or carriage returns
          PROJECT_ID=$(echo "${RAW_PROJECT_ID}" | tr -d '[:space:]')
          IMAGE_URI="us-central1-docker.pkg.dev/${PROJECT_ID}/industrial-repo/industrial-mcp:${COMMIT_SHA}"
          IMAGE_LATEST="us-central1-docker.pkg.dev/${PROJECT_ID}/industrial-repo/industrial-mcp:latest"
          echo "Building image: ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}" .
          docker tag "${IMAGE_URI}" "${IMAGE_LATEST}"
          docker push "${IMAGE_URI}"
          docker push "${IMAGE_LATEST}"

      - name: Deploy to Cloud Run
        env:
          RAW_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PROJECT_ID=$(echo "${RAW_PROJECT_ID}" | tr -d '[:space:]')
          IMAGE_URI="us-central1-docker.pkg.dev/${PROJECT_ID}/industrial-repo/industrial-mcp:${COMMIT_SHA}"
          echo "Deploying ${IMAGE_URI} to Cloud Run service industrial-mcp..."
          gcloud run deploy industrial-mcp \
            --image="${IMAGE_URI}" \
            --region=us-central1 \
            --project="${PROJECT_ID}" \
            --port=8000 \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300s

