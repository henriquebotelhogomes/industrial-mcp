name: CI/CD & DevSecOps Supply Chain Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  quality-and-tests:
    name: Lint, Typing & Deterministic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-extras --frozen

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run MyPy Type Checker
        run: uv run mypy src

      - name: Run Pytest Test Suite
        run: uv run pytest -v --maxfail=1

  supply-chain-security:
    name: Container Build, Trivy Vulnerability Scan & Syft SBOM
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: industrial-mcp:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (Supply Chain Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: industrial-mcp:ci-test
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Generate SBOM via Syft (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: industrial-mcp:ci-test
          format: spdx-json
          output-file: sbom-industrial-mcp.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom-industrial-mcp.spdx.json
